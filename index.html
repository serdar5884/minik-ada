#wdial .orb.s{background:radial-gradient(circle,#fff6c4 40%,#ffd45a 70%);box-shadow:0 0 8px 3px #ffe88a99}
#wdial .orb.m{background:radial-gradient(circle at 35% 35%,#fffbe8 50%,#d9d4ff);box-shadow:0 0 8px 2px #cfd6ff88}
#wdial .orb.m::after{content:"";position:absolute;right:-2px;top:-2px;width:10px;height:10px;border-radius:50%;background:var(--mc,#1c2866);opacity:.0}
#wdial .stars{position:absolute;inset:0;opacity:0}
#wper{font-size:11.5px;font-weight:800;opacity:.7;letter-spacing:.3px;line-height:1.1}
#wtime{font-size:19px;font-weight:900;line-height:1.1;white-space:nowrap}
#wtime small{font-size:11px;margin-left:3px;opacity:.7}
#wchip{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;background:#3b2f4a12;border-radius:99px;padding:3px 10px;white-space:nowrap;align-self:flex-start}
#wchip i{width:1.5px;height:12px;background:#3b2f4a33;border-radius:2px}
@media (max-width:520px){#wcard{padding:5px 10px 6px 5px;gap:4px;border-radius:19px}#wdial{width:44px;height:44px}#wtime{font-size:16px}#wper{font-size:10.5px}#wchip{font-size:11.5px;padding:2px 8px}}
#clock #clockT{display:none}#clock{padding:3px 4px 3px 4px}
@media (max-width:520px){
.topL{display:grid!important;grid-template-columns:auto 1fr;gap:6px;width:calc(100vw - 24px - 100px - var(--sal) - var(--sar))!important;align-items:stretch!important}
#wcard{grid-row:1/3}#coins,#coll{align-self:start}.topL #quest,.topL #inv{grid-column:1/-1}
#clock{display:grid!important;grid-template-columns:repeat(2,38px);border-radius:24px;padding:4px 5px!important;gap:0}
#clock .sbtn{width:38px!important;height:38px!important;line-height:38px!important;margin:0!important;font-size:17px}
#clock .sbtn::before{inset:4px!important}}
body:has(#help.open) #pol{display:none}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 46%,transparent 52%,rgba(40,24,70,.42) 100%);opacity:.5}
#rb{position:fixed;left:50%;top:calc(14px + var(--sat));transform:translate(-50%,-26px) scale(.9);opacity:0;pointer-events:none;z-index:3;transition:.45s cubic-bezier(.3,1.4,.5,1);filter:drop-shadow(0 5px 0 #0002)}
#rb.show{opacity:1;transform:translate(-50%,0) scale(1)}
#rb .rbm{position:relative;background:#fff3d6;color:var(--ink);font-weight:900;font-size:17px;padding:7px 26px;white-space:nowrap;border-top:3px solid #fff;border-bottom:3px solid #f2c97b;display:flex;gap:9px;align-items:center}
#rb .rbm::before,#rb .rbm::after{content:"";position:absolute;top:6px;width:26px;height:100%;background:#f8d68f;z-index:-1}
#rb .rbm::before{left:-20px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,28% 50%)}
#rb .rbm::after{right:-20px;clip-path:polygon(0 0,100% 0,72% 50%,100% 100%,0 100%)}
#rb small{font-size:12.5px;opacity:.7;font-weight:800}
@media (max-width:900px){#rb{top:max(30%,230px)}#rb .rbm{font-size:15px;padding:6px 20px}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
#flash.go{animation:fl .55s ease-out}@keyframes fl{0%{opacity:.95}100%{opacity:0}}
#pframe{position:fixed;inset:14px;pointer-events:none;z-index:8;opacity:0;transition:opacity .2s}
body.photo #pframe{opacity:1}
#pframe i{position:absolute;width:34px;height:34px;border:4px solid #fff;filter:drop-shadow(0 2px 0 #0003)}
#pframe i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
#pframe i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
#pframe i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 12px}
#pframe i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 12px 0}
body.photo .hud>*:not(#toast){visibility:hidden}
#pol{position:fixed;right:calc(14px + var(--sar));bottom:calc(120px + var(--sab));width:150px;background:#fffdf7;padding:8px 8px 6px;border-radius:6px;box-shadow:0 8px 0 #0002,0 14px 30px #0003;z-index:8;transform:translate(120%,30px) rotate(10deg);opacity:0;transition:transform .7s cubic-bezier(.2,1.3,.4,1),opacity .4s;pointer-events:none;text-align:center;color:var(--ink)}
#pol.show{transform:translate(0,0) rotate(-4deg);opacity:1;pointer-events:auto}
#pol img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:3px;background:#ddd;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#pol b{display:block;font-size:13px;margin-top:6px}#pol small{display:block;font-size:10.5px;opacity:.65;font-weight:700}#pol .hint{font-size:10.5px;font-weight:800;color:#c0587a;margin-top:3px}
@media (orientation:portrait){#pol{bottom:calc(250px + var(--sab));width:128px}}
#help{position:fixed;inset:0;background:#2b1d3acc;display:none;align-items:center;justify-content:center;z-index:7;padding:calc(12px + var(--sat)) 12px calc(12px + var(--sab))}
#help.open{display:flex}
#help .sheet{padding-top:0}
#help h2{margin:16px 0 4px;font-size:21px}#help h3{margin:12px 0 6px;font-size:14px;opacity:.7}
#help .kg{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:14px;font-weight:700}
#help kbd{font:800 12px inherit;background:#fff;border-radius:8px;padding:3px 8px;box-shadow:0 2px 0 #3b2f4a33;white-space:nowrap}
#help .tg{font-size:14px;font-weight:700;line-height:1.55;margin:0;padding-left:18px}
#help .hh{position:sticky;top:0;background:#fff8ec;display:flex;justify-content:space-between;align-items:center;padding:8px 0;z-index:1}
#petp{position:fixed;left:50%;top:63%;transform:translateX(-50%);z-index:2;display:none;border:0;background:var(--card);color:var(--ink);font:800 16px inherit;border-radius:999px;padding:8px 18px;min-height:44px;box-shadow:0 4px 0 #0003,0 8px 18px #0002;cursor:pointer;white-space:nowrap;animation:pop .25s}
#petp kbd{background:#ff8fa3;color:#fff;border-radius:8px;padding:2px 8px;margin-right:6px;font:900 14px inherit}
#petr{position:fixed;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px dashed #fff;box-shadow:0 0 0 2px #ff8fa388,inset 0 0 12px #ff8fa366;pointer-events:none;z-index:2;display:none;animation:spin 6s linear infinite}
#petr.hit{border-style:solid;border-color:#ff8fa3;animation:ping .5s ease-out}
@keyframes spin{to{rotate:360deg}}@keyframes ping{from{scale:.6}to{scale:1.3;opacity:.3}}
body.photo #petp,body.photo #petr{display:none!important}

#pal{display:none!important}
#bbar{display:none;position:absolute;left:calc(158px + var(--sal));right:calc(12px + var(--sar));bottom:calc(86px + var(--sab));background:var(--card);border-radius:22px;padding:6px 8px 4px;box-shadow:0 4px 0 #0003,0 6px 14px #0002;pointer-events:auto;align-items:center;gap:8px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.hud.build #bbar{display:flex}
body:has(#shop.open) #bbar,body:has(#bbReset.open) #bbar{visibility:hidden}
#bbar .tools{align-self:flex-end;margin-bottom:4px}
#bbar .tool{width:44px;min-height:46px}
#bbSlots{display:flex;gap:5px;overflow-x:auto;overflow-y:hidden;padding:14px 3px 3px;flex:1;min-width:0;scrollbar-width:none;overscroll-behavior:contain;touch-action:pan-x;scroll-snap-type:x proximity}
#bbSlots::-webkit-scrollbar{display:none}
.bs{position:relative;flex:0 0 58px;height:62px;border:3px solid transparent;border-radius:14px;background:#fff;box-shadow:0 3px 0 #0002;padding:0;cursor:pointer;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .15s}
.bs canvas{width:44px;height:44px;display:block;pointer-events:none}
.bs kbd{position:absolute;left:4px;top:1px;font:900 10px ui-rounded,system-ui,sans-serif;color:var(--ink);opacity:.55;pointer-events:none}
.bs.no{opacity:.55}

.bs.on.hop{animation:bsHop .4s cubic-bezier(.3,1.4,.5,1)}

 #bbar{left:calc(12px + var(--sal));bottom:calc(228px + var(--sab));max-width:560px;flex-direction:column;align-items:stretch;gap:2px;padding:6px 8px 4px}
 #bbar .tools{align-self:center;margin:0}

}
